<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Mobile friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="calculator">
    <input type="text" id="display" disabled>

    <div class="trig">
        <button onclick="appendTrig('sin')">sin</button>
        <button onclick="appendTrig('cos')">cos</button>
        <button onclick="appendTrig('tan')">tan</button>

        <button onclick="appendValue('ln(')">ln</button>
        <button onclick="appendValue('log(')">log</button>
        <button onclick="toggleInv()" id="inv">INV</button>
        <button onclick="toggleDegRad()" class="mode" id="mode">DEG</button>
    </div>

    <div class="grid">
        <!-- Row 1 -->
        <button onclick="clearDisplay()" class="danger">C</button>
        <button onclick="deleteOne()">⌫</button>
        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue(')')">)</button>

        <!-- Row 2 -->
        <button onclick="appendValue('!')">!</button>
        <button onclick="appendValue('%')">%</button>
        <button onclick="appendValue('^')">^</button>
        <button onclick="appendValue('sqrt(')">√</button>
        <button onclick="appendValue('/')">÷</button>

        <!-- Numbers -->
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('+')">+</button>

        <!-- Bottom -->
        <button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('pi')">π</button>
        <button onclick="appendValue('e')">e</button>
        <button onclick="appendDot()">.</button>
        <button onclick="calculate()" class="equals">=</button>
    </div>
</div>

<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
